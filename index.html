    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        app: {
                            bg: '#050505', card: '#111111', lighter: '#1b1b1b',  
                            primary: '#3b82f6', text: '#f8fafc', muted: '#94a3b8',    
                            border: '#2a2a2a', success: '#10b981', warning: '#f59e0b',
                        }
                    },
                    animation: { 
                        'fade-in': 'fadeIn 0.2s ease-out', 
                        'slide-up': 'slideUp 0.3s ease-out',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'grow-line': 'growLine 0.4s ease-out forwards'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        growLine: { '0%': { height: '0%' }, '100%': { height: '100%' } },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
        .fab-shadow { box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.5); }
        .nav-item.active { color: #3b82f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .custom-checkbox {
            appearance: none; background-color: #1e293b; margin: 0; width: 1.25em; height: 1.25em; 
            border: 1px solid #3b82f6; border-radius: 0.25em; display: grid; place-content: center; cursor: pointer;

            content: ""; width: 0.65em; height: 0.65em; transform: scale(0);

        .custom-checkbox:checked { background-color: #3b82f6; }
        .custom-checkbox:checked::before { transform: scale(1); }

        .custom-checkbox-green {
            appearance: none; background-color: #064e3b; margin: 0; width: 1.25em; height: 1.25em; 
            border: 1px solid #10b981; border-radius: 0.25em; display: grid; place-content: center; cursor: pointer;
        }
        .custom-checkbox-green::before {

        }
        .custom-checkbox-green:checked { background-color: #10b981; }
        .custom-checkbox-green:checked::before { transform: scale(1); }
        
        /* Glass Effect */
        .glass-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(18, 18, 18, 0.85) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Keypad Styling */
        .keypad-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background-color: #1e293b; color: white; font-size: 26px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.1s;
            user-select: none;
            border: 1px solid #334155;
        }
        .keypad-btn:active { background-color: #3b82f6; border-color: #3b82f6; transform: scale(0.95); }
        
        .dot {
            width: 14px; height: 14px; border-radius: 50%;
            background-color: #334155; transition: all 0.2s ease;
        }
        .dot.active {
            background-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
            transform: scale(1.1);
        }

        /* Nav active top-glow indicator */
        .nav-item.active { color: #3b82f6; position: relative; }
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: -4px; left: 50%;
            transform: translateX(-50%);
            width: 32px; height: 3px;
            background: #3b82f6;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 0 10px 2px rgba(59, 130, 246, 0.7);
        }

        /* Stat card gradients */
        .stat-card-revenue    { background: linear-gradient(135deg,rgba(16,185,129,.12) 0%,rgba(12,12,12,.95) 100%); border-color:rgba(16,185,129,.25)!important; }
        .stat-card-outstanding{ background: linear-gradient(135deg,rgba(245,158,11,.12) 0%,rgba(12,12,12,.95) 100%); border-color:rgba(245,158,11,.25)!important; }
        .stat-card-jobs       { background: linear-gradient(135deg,rgba(59,130,246,.12) 0%,rgba(12,12,12,.95) 100%); border-color:rgba(59,130,246,.25)!important; }
        .stat-card-completion { background: linear-gradient(135deg,rgba(168,85,247,.12) 0%,rgba(12,12,12,.95) 100%); border-color:rgba(168,85,247,.25)!important; }

        /* Revenue goal progress */
        .goal-bar { transition: width .7s cubic-bezier(.4,0,.2,1); }

        /* Modal overlay / bottom-sheet */
        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,.88);
            backdrop-filter:blur(8px); z-index:200;
            display:flex; align-items:flex-end; justify-content:center;
            animation:fadeIn .2s ease-out;
        }
        .modal-sheet {
            background:#111111; border:1px solid #2a2a2a;
            border-radius:24px 24px 0 0; width:100%; max-width:480px;
            padding:24px; animation:slideUp .3s ease-out;
            max-height:92vh; overflow-y:auto;
        }

        /* Signature canvas wrapper */
        .sig-canvas-wrap {
            border:2px dashed #334155; border-radius:12px;
            background:#fff; position:relative; overflow:hidden;
        }
        #sig-canvas { display:block; touch-action:none; cursor:crosshair; }
        #sig-placeholder {
            position:absolute; inset:0; display:flex;
            align-items:center; justify-content:center;
            pointer-events:none;
        }

        /* Photo lightbox */
        .lightbox-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,.96);
            z-index:300; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            animation:fadeIn .18s ease-out;
        }
    </style>
</head>

    <script>
        const DEFAULT_TEMPLATES = [
            {
                id: 'tpl-quote-sent',
                name: 'Quote Sent',
                subject: 'Your Elite Wrapz Quote',
                body: 'Hi {name},\n\nThank you for considering Elite Wrapz!\n\nYour total quote is {quoteTotal}, with a deposit of {depositTotal} required to secure your booking.\n\nPlease note:\n- Quotes are valid for 30 days.\n- To accept this quote, simply reply to this message.\n- We offer a Price Match Guarantee with proof of an official business quote (letterhead or email with full breakdown).\n- Discounts must be mentioned before your deposit is paid.\n- Deposits are non-refundable unless otherwise stated in our terms.\n\nFull terms & conditions: https://elitewrapz.uk/termsandconditions\n\nBest regards,\nThe Elite Wrapz Team',
                channel: 'email'
            },
            {
                id: 'tpl-quote-reminder',
                name: 'Quote Reminder',
                subject: 'Following Up on Your Elite Wrapz Quote',
                body: 'Hi {name},\n\nJust checking in to see if you had a chance to review your quote from Elite Wrapz.\n\nIf you’d like to move forward, we’d love to get you booked in and secure your date. If you have any questions, feel free to reply anytime.\n\nBest regards,\nThe Elite Wrapz Team',
                channel: 'email'
            },
            {
                id: 'tpl-deposit-request',
                name: 'Deposit Request',
                subject: 'Your Elite Wrapz Quote & Deposit Request',
                body: 'Hi {name},\n\nThank you for choosing Elite Wrapz!\n\nYour quote total is {quoteTotal}, with a deposit of {depositTotal} required to secure your booking. Please use the link below to pay your deposit:\n\n🔗 {paymentLink}\n\n⚠️ Please note:\n- We can only hold your requested date for 24 hours without a deposit.\n- All quotes are valid for 30 days.\n- Any discount codes must be provided before your deposit is paid.\n\nFull terms: https://elitewrapz.uk/termsandconditions\n\nBest regards,\nThe Elite Wrapz Team',
                channel: 'email'
            },
            {
                id: 'tpl-services-agreement',
                name: 'Services Agreement',
                subject: 'Elite Wrapz – Services Agreement Review',
                body: 'Hi {name},\n\nPlease find attached our Services Agreement for you to review.\n\nIf you’re happy with everything, I can send you a secure link to provide your signature digitally. Alternatively, if we’re meeting in person, I can collect your signature on the day.\n\nIf you have any questions, please let me know before signing.\n\nOnce signed, we’ll be ready to move forward with your project.\n\nBest regards,\nThe Elite Wrapz Team',
                channel: 'email'
            },
            {
                id: 'tpl-signature-request',
                name: 'Signature Request',
                subject: 'Elite Wrapz has requested your signature – {agreementType}',
                body: 'Hi {name},\n\nWe’ve set up a secure link for you to digitally sign your {agreementType}.\n\nPlease click below to review and sign:\n\n🔗 {signatureLink}\n\nOnce signed, you’ll receive a confirmation email and your copy of the signed document.\n\nIf you have any questions, let us know before completing the signature.\n\nBest regards,\nThe Elite Wrapz Team',
                channel: 'email'
            },
            {
                id: 'tpl-booking-confirmation',
                name: 'Booking Confirmation',
                subject: 'Your Elite Wrapz Booking is Confirmed',
                body: 'Hi {name},\n\nWe’re pleased to confirm your Elite Wrapz booking:\n\n📅 Date: {bookingDate}\n⏰ Time: {bookingTime}\n\nBefore the day, please make sure all wrap areas are clear of items.\n\nYou’ll also receive a final checklist email 1 day before we arrive.\n\nBest regards,\nThe Elite Wrapz Team',
                channel: 'email'
            },
            {
                id: 'tpl-wrap-day-prep',
                name: 'Wrap Day Prep',
                subject: 'Final Prep Before Your Wrap Day – Elite Wrapz',
                body: 'Hi {name},\n\nYour big vinyl-wrapping day is almost here, and we’re just as excited as you are! Before we get started, here are a few quick notes to help things run smoothly:\n\n📦 Access & Parking\nPlease let us know about any tricky gates, parking restrictions, or local surprises.\n\n🧹 Clear Surfaces\nKindly make sure worktops and the surrounding area are clear. Insurance rules mean we can’t move personal items.\n\n🐾 Pets & Safety\nPlease keep pets and little ones away from the workspace during installation.\n\n🧴 Cleaning & Primer\nWe use strong cleaning agents and a primer before wrapping. If anyone in your household is pregnant, sensitive to strong smells, or you’d prefer us not to use these, please let us know in advance. The primer smell is temporary and fades quickly, but the cleaner lingers a little longer.\n\n⏳ All-Day Job\nWrapping can take most of the day depending on your kitchen. If you need to pop out, that’s no problem—just please ensure someone is back home for the final handover.\n\n💳 Payments\nIf there are any outstanding payments, now’s the time to get those squared away.\n\nWe’re looking forward to making your kitchen look amazing!\nBest regards,\nElite Wrapz Team',
                channel: 'whatsapp'
            },
            {
                id: 'tpl-thank-you-reviews',
                name: 'Thank You & Reviews',
                subject: 'Thank You for Choosing Elite Wrapz – Share Your Thoughts',
                body: 'Hi {name},\n\nWe just wanted to say a huge thank you for choosing Elite Wrapz to transform your space – we hope you love the results!\n\nYour feedback means the world to us and helps others discover what we do. Please leave us a review:\n\n⭐ Google: https://share.google/JaMpIl01UkDLu8Qhx\n⭐ Trustpilot: https://uk.trustpilot.com/review/elitewrapz.uk\n⭐ Facebook: https://www.facebook.com/share/1ChEa8KkqQ/?mibextid=\n\n💡 Leave a review on all three and you’ll receive 20% off your next wrap as a thank you!\n\nBest regards,\nThe Elite Wrapz Team',
                channel: 'email'
            }
        ];

        function mergeWithDefaultTemplates(rawTemplates = []) {
            const defaults = [...DEFAULT_TEMPLATES];
            const normalizedExisting = (Array.isArray(rawTemplates) ? rawTemplates : []).map((t, idx) => ({
                id: (t.id || `tpl-custom-${idx + 1}`).toString(),
                name: (t.name || `Template ${idx + 1}`).toString(),
                subject: (t.subject || '').toString(),
                body: (t.body || '').toString(),
                channel: (t.channel || 'email').toString().toLowerCase()
            }));
            const map = new Map(defaults.map(t => [t.id, t]));
            normalizedExisting.forEach(t => map.set(t.id, t));
            return Array.from(map.values());
        }

        const DEFAULT_CONTACT_TAGS = [
            { id: 'tag-customer', name: 'Customer', color: '#3b82f6' },
            { id: 'tag-supplier', name: 'Supplier', color: '#f59e0b' }
        ];

        function normalizeContactTags(rawTags = []) {
            const source = Array.isArray(rawTags) && rawTags.length ? rawTags : DEFAULT_CONTACT_TAGS;
            return source.map((t, idx) => ({
                id: (t.id || `tag-${idx + 1}`).toString(),
                name: (t.name || `Tag ${idx + 1}`).toString(),
                color: /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test((t.color || '').toString()) ? t.color.toString() : '#64748b'
            }));
        }

        // --- DATA MANAGEMENT ---
        const DB = {
            jobs: [], contacts: [], user: { name: "Richard", email: "richarddyatess@gmail.com" },
            settings: { monthlyGoal: 5000, templates: [...DEFAULT_TEMPLATES], contactTags: [...DEFAULT_CONTACT_TAGS], branding: { companyName: 'ELITE WRAPZ', logoUrl: '', accentColor: '#3b82f6' } },
            updatedAt: null,
            secureNotes: "Gateway ID: 54 02 69 02 45 51\nEORI: GB045268219000",
            vaultEntries: [
                { id: 'vault-gateway', label: 'Gateway ID', value: '54 02 69 02 45 51', kind: 'Code' },
                { id: 'vault-eori', label: 'EORI Number', value: 'GB045268219000', kind: 'Code' }
            ],
            makeId(prefix = 'id') {
                return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
            },
            uniqueList(list = []) {
                return [...new Set((Array.isArray(list) ? list : []).filter(Boolean))];
            },
            normalizeAndDeduplicateData() {
                // Contacts
                const contactsByKey = new Map();
                (this.contacts || []).forEach(c => {
                    const id = c?.id || this.makeId('contact');
                    const name = (c?.name || '').trim();
                    const email = (c?.email || '').trim().toLowerCase();
                    const key = id || (email ? `email:${email}` : `name:${name.toLowerCase()}`);
                    if (!contactsByKey.has(key)) contactsByKey.set(key, {
                        ...c,
                        id,
                        name,
                        tagIds: this.uniqueList(Array.isArray(c?.tagIds) ? c.tagIds : (c?.tagId ? [c.tagId] : []))
                    });
                });
                this.contacts = Array.from(contactsByKey.values());

                // Jobs
                const jobsByKey = new Map();
                (this.jobs || []).forEach(j => {

            migrateData() {
                this.contacts = (this.contacts || []).map(c => ({
                    ...c,
                    id: c.id || this.makeId('contact'),
                    company: c.company || '',
                    fao: c.fao || '',
                    website: c.website || '',
                    notes: c.notes || '',
                    tagIds: this.uniqueList(Array.isArray(c.tagIds) ? c.tagIds : (c.tags ? String(c.tags).split(',').map(x => x.trim()).filter(Boolean) : []))
                }));
                this.jobs = (this.jobs || []).map(j => {
                    const n = { ...j };
                    if (n.contactId && !n.contact) {
                        const contact = this.contacts.find(c => c.id === n.contactId);
                        if (contact) n.contact = contact.name;
                    }
                    if (!n.contactId && n.contact) {
                        const contact = this.contacts.find(c => c.name === n.contact);
                        if (contact) n.contactId = contact.id;
                    }
                    if (!Array.isArray(n.beforePhotos)) n.beforePhotos = Array.isArray(n.photos) ? [...n.photos] : [];
                    if (!Array.isArray(n.afterPhotos)) n.afterPhotos = [];
                    return n;

            getJobsForDate(d) { 
                return this.jobs.filter(j => {
                    if (j.durationDays && parseInt(j.durationDays) > 1) {
                        const checkDate = new Date(d + 'T12:00:00');
                        const startDate = new Date(j.date + 'T12:00:00');
                        const endDate = new Date(startDate);
                        endDate.setDate(startDate.getDate() + (parseInt(j.durationDays) - 1));
                        return checkDate >= startDate && checkDate <= endDate;
                    }
                    return j.date === d;
                }); 
            },

            getUpcomingJobs() {
                const today = Utils.formatDate(new Date());
                return this.jobs
                    .filter(j => j.date >= today && j.status !== 'Cancelled' && j.status !== 'Completed')
                    .sort((a, b) => new Date(a.date + 'T' + (a.time||'00:00')) - new Date(b.date + 'T' + (b.time||'00:00')));

            getDashboardStats() {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const monthJobs = this.jobs.filter(j => {
                    const d = new Date(j.date + 'T12:00:00');
                    return d.getMonth() === currentMonth && d.getFullYear() === currentYear && j.status !== 'Cancelled' && (j.type === 'Job' || !j.type);
                });
                const totalRevenue = monthJobs.reduce((acc, j) => acc + (parseFloat(j.price)||0), 0);
                const completedCount = monthJobs.filter(j => j.status === 'Completed').length;
                const outstanding = this.jobs.reduce((acc, j) => {
                    if(j.status === 'Cancelled' || j.fullPaymentPaid || (j.type && j.type !== 'Job')) return acc;
                    const price = parseFloat(j.price) || 0;
                    const deposit = parseFloat(j.deposit) || 0;
                    return acc + (price - deposit);
                }, 0);
                return { monthRevenue: totalRevenue, monthCount: monthJobs.length, completedCount: completedCount, outstanding: outstanding };
            },
            getMaterialReminders(daysAhead = 5) {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const max = new Date(today);
                max.setDate(max.getDate() + daysAhead);
                return this.jobs
                    .filter(j => (!j.type || j.type === 'Job') && j.status !== 'Cancelled' && j.status !== 'Completed')
                    .filter(j => {
                        const d = new Date((j.date || '') + 'T12:00:00');
                        return d >= today && d <= max;
                    })
                    .filter(j => !j.materialsOrdered || !j.materialsDelivered)
                    .sort((a, b) => new Date(a.date + 'T12:00:00') - new Date(b.date + 'T12:00:00'));
            },
            getActionQueue(limit = 8) {
                const now = new Date();
                const todayIso = Utils.formatDate(now);
                const soon = new Date(now);
                soon.setDate(soon.getDate() + 2);
                const soonIso = Utils.formatDate(soon);
                const queue = [];
                this.jobs.forEach(j => {
                    const isJob = !j.type || j.type === 'Job';
                    if (!isJob || j.status === 'Cancelled') return;
                    const jobDate = new Date((j.date || '') + 'T12:00:00');
                    const todayDate = new Date(todayIso + 'T12:00:00');
                    const daysUntil = Math.round((jobDate - todayDate) / 86400000);
                    const balance = (parseFloat(j.price) || 0) - (parseFloat(j.deposit) || 0);
                    if (daysUntil <= 0 && !j.fullPaymentPaid && balance > 0) {
                        queue.push({ id: j.id, level: 'high', text: `Payment due · £${balance.toFixed(2)} · ${j.jobNumber || j.title}` });
                    }
                    if (daysUntil <= 0 && !j.clientSignature && j.status !== 'Completed') {
                        queue.push({ id: j.id, level: 'med', text: `Sign-off needed · ${j.jobNumber || j.title}` });
                    }
                    if (daysUntil >= 0 && daysUntil <= 2 && (!j.materialsOrdered || !j.materialsDelivered) && j.status !== 'Completed') {
                        queue.push({ id: j.id, level: 'med', text: `Materials check · ${j.jobNumber || j.title}` });
                    }
                });
                return queue.slice(0, limit);
            }

                clearTimeout(this.pushTimer);
                this.pushTimer = setTimeout(() => this.pushRemoteData(), 800);
            },
            parseTimestamp(ts) {
                const ms = Date.parse(ts || '');
                return Number.isFinite(ms) ? ms : 0;
            },
            buildMergedPayload(localData = {}, remoteData = {}) {
                const localMs = this.parseTimestamp(localData.updatedAt);
                const remoteMs = this.parseTimestamp(remoteData.updatedAt);
                const preferLocal = localMs >= remoteMs;
                const primary = preferLocal ? localData : remoteData;
                const secondary = preferLocal ? remoteData : localData;
                return {
                    jobs: [...(primary.jobs || []), ...(secondary.jobs || [])],
                    contacts: [...(primary.contacts || []), ...(secondary.contacts || [])],
                    vaultEntries: [...(primary.vaultEntries || []), ...(secondary.vaultEntries || [])],
                    secureNotes: primary.secureNotes || secondary.secureNotes || '',
                    settings: { ...(secondary.settings || {}), ...(primary.settings || {}) },
                    updatedAt: new Date().toISOString()
                };
            },
            async autoSync(reason = 'auto') {
                const now = Date.now();
                if (!this.user || !this.store || this.syncInProgress) return;
                if (now - this.lastSyncAttemptAt < 15000) return;
                this.lastSyncAttemptAt = now;
                try {
                    await this.pullRemoteData({ silent: true, forceReconcile: true });
                } catch (err) {
                    console.warn(`Auto sync (${reason}) failed`, err);
                }
            },
            async pushRemoteData(options = {}) {
                if (!this.user || !this.store) return;
                this.syncInProgress = true;
                this.lastSyncStatus = 'Syncing';
                try {
                    await this.store.collection('trackerData').doc(this.user.uid).set(DB.getSerializableData(), { merge: true });
                    this.lastSyncedAt = new Date().toISOString();
                    this.lastSyncStatus = 'Synced';
                    this.pendingChanges = false;
                    if (!options.silent) showToast('Cloud data uploaded');
                } finally {
                    this.syncInProgress = false;
                    if (router.currentRoute === 'more') router.renderMore(document.getElementById('app-content'));
                }
            },
            async pullRemoteData(options = {}) {
                if (!this.user || !this.store) return;
                this.syncInProgress = true;
                this.lastSyncStatus = 'Syncing';
                const ref = this.store.collection('trackerData').doc(this.user.uid);
                try {
                    const snap = await ref.get();
                    if (snap.exists) {
                        const remoteData = snap.data() || {};
                        if (options.forceReconcile) {
                            const merged = this.buildMergedPayload(DB.getSerializableData(), remoteData);
                            DB.loadFromObject(merged);
                            await ref.set(DB.getSerializableData(), { merge: false });
                        } else {
                            DB.loadFromObject(remoteData);
                        }
                        this.lastSyncedAt = new Date().toISOString();
                        this.lastSyncStatus = 'Synced';
                        this.pendingChanges = false;
                        if (!options.silent) showToast('Cloud data synced');
                    } else {
                        await ref.set(DB.getSerializableData(), { merge: true });
                        this.lastSyncedAt = new Date().toISOString();
                        this.lastSyncStatus = 'Initialized';
                        this.pendingChanges = false;
                        if (!options.silent) showToast('Cloud store initialized');
                    }
                } finally {
                    this.syncInProgress = false;
                    if (router.currentRoute === 'more') router.renderMore(document.getElementById('app-content'));
                }
            }

            renderProjects(container) {
                const statusFilter = this.params.projectFilter || 'All';
                const sortBy = this.params.projectSort || 'newest';
                const monthFilter = this.params.projectMonth || 'all';
                const typeFilter = this.params.projectType || 'All';
                const paymentFilter = this.params.projectPayFilter || 'All';
                const materialFilter = this.params.projectMatFilter || 'All';
                const groupMode = this.params.projectGroupMode || 'month';
                const showAdvanced = !!this.params.projectShowAdvanced;
                const query = (this.params.projectSearch || '').trim().toLowerCase();

                const asType = (j) => j.type || 'Job';
                const monthKey = (j) => (j.date || '').slice(0, 7);
                const monthLabel = (key) => {
                    if (!key || key.length < 7) return 'No Date';
                    const [y, m] = key.split('-').map(Number);
                    return new Date(y, (m || 1) - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
                };
                const isJobType = (j) => asType(j) === 'Job';
                const priceOf = (j) => parseFloat(j.price) || 0;
                const depositOf = (j) => parseFloat(j.deposit) || 0;
                const balanceOf = (j) => priceOf(j) - depositOf(j);
                const isPaid = (j) => isJobType(j) && !!j.fullPaymentPaid;
                const paymentState = (j) => {
                    if (!isJobType(j)) return { text: asType(j), className: 'text-app-muted' };
                    if (j.fullPaymentPaid) return { text: 'PAID', className: 'text-emerald-400' };
                    if (j.paymentPlanEnabled) return { text: 'PAYMENT PLAN', className: 'text-indigo-300' };
                    if (j.depositPaid) return { text: 'DEPOSIT PAID', className: 'text-cyan-300' };
                    const bal = Math.max(0, balanceOf(j));
                    return { text: bal > 0 ? `Due £${bal.toFixed(2)}` : 'Pending payment status', className: bal > 0 ? 'text-amber-400' : 'text-app-muted' };
                };

                const monthOptions = [...new Set(DB.jobs.map(monthKey).filter(Boolean))]
                    .sort((a, b) => (a < b ? 1 : -1));

                let jobs = [...DB.jobs];
                if (statusFilter !== 'All') jobs = jobs.filter(j => (j.status || 'Scheduled') === statusFilter);
                if (typeFilter !== 'All') jobs = jobs.filter(j => asType(j) === typeFilter);
                if (monthFilter !== 'all') jobs = jobs.filter(j => monthKey(j) === monthFilter);
                if (paymentFilter === 'Paid') jobs = jobs.filter(j => isPaid(j));
                if (paymentFilter === 'Outstanding') jobs = jobs.filter(j => isJobType(j) && !isPaid(j) && balanceOf(j) > 0);
                if (paymentFilter === 'Payment Plan') jobs = jobs.filter(j => !!j.paymentPlanEnabled);
                if (paymentFilter === 'Deposit Missing') jobs = jobs.filter(j => isJobType(j) && depositOf(j) > 0 && !j.depositPaid);
                if (materialFilter === 'Missing Ordered') jobs = jobs.filter(j => isJobType(j) && !j.materialsOrdered);
                if (materialFilter === 'Missing Delivered') jobs = jobs.filter(j => isJobType(j) && !j.materialsDelivered);

                if (query) {
                    jobs = jobs.filter(j =>
                        (j.title || '').toLowerCase().includes(query) ||
                        (j.jobNumber || '').toLowerCase().includes(query) ||
                        (j.jobReference || '').toLowerCase().includes(query) ||
                        (j.contact || '').toLowerCase().includes(query) ||
                        (j.address || '').toLowerCase().includes(query)
                    );
                }

                if (sortBy === 'newest') jobs.sort((a,b) => new Date((b.date||'')+'T12:00:00') - new Date((a.date||'')+'T12:00:00'));
                else if (sortBy === 'oldest') jobs.sort((a,b) => new Date((a.date||'')+'T12:00:00') - new Date((b.date||'')+'T12:00:00'));
                else if (sortBy === 'price') jobs.sort((a,b) => priceOf(b) - priceOf(a));
                else if (sortBy === 'balance') jobs.sort((a,b) => balanceOf(b) - balanceOf(a));

                const statusColors = {
                    'Scheduled': 'bg-blue-500/20 text-blue-400 border-blue-500/40',
                    'Completed': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40',
                    'Cancelled': 'bg-red-500/20 text-red-400 border-red-500/40'
                };
                const filters = ['All','Scheduled','Completed','Cancelled'];
                const types = ['All','Job','Consultation','Holiday','Personal'];
                const payFilters = ['All','Outstanding','Paid','Payment Plan','Deposit Missing'];
                const matFilters = ['All','Missing Ordered','Missing Delivered'];
                const sorts = [
                    {v:'newest',l:'Newest'},
                    {v:'oldest',l:'Oldest'},
                    {v:'price',l:'Price'},
                    {v:'balance',l:'Balance'}
                ];

                const activeJobs = jobs.filter(j => (j.status || 'Scheduled') !== 'Cancelled');
                const totalValue = activeJobs.reduce((a, j) => a + priceOf(j), 0);
                const outstanding = activeJobs.reduce((a, j) => a + (isJobType(j) && !isPaid(j) ? Math.max(0, balanceOf(j)) : 0), 0);
                const completedCount = jobs.filter(j => j.status === 'Completed').length;
                const completionPct = jobs.length ? Math.round((completedCount / jobs.length) * 100) : 0;

                const grouped = jobs.reduce((acc, j) => {
                    const key = groupMode === 'month' ? (monthKey(j) || 'no-date') : 'all';
                    if (!acc[key]) acc[key] = [];
                    acc[key].push(j);
                    return acc;
                }, {});
                const groupKeys = Object.keys(grouped).sort((a,b) => (a < b ? 1 : -1));
                const timelineJobs = [...jobs].sort((a, b) => new Date((a.date || '') + 'T12:00:00') - new Date((b.date || '') + 'T12:00:00'));
                const timelineHtml = timelineJobs.map((j, idx) => {
                    const isJob = isJobType(j);
                    const payment = paymentState(j);
                    const start = new Date((j.date || '') + 'T12:00:00');
                    const end = new Date(start);
                    const dur = Math.max(1, parseInt(j.durationDays || 1) || 1);
                    end.setDate(end.getDate() + (dur - 1));
                    const endIso = Utils.formatDate(end);
                    return `<div class="relative pl-6 pb-4">
                        <div class="absolute left-2 top-1 w-2.5 h-2.5 rounded-full ${j.status==='Completed'?'bg-emerald-400':j.status==='Cancelled'?'bg-red-400':'bg-blue-400'}"></div>
                        ${idx < timelineJobs.length - 1 ? '<div class="absolute left-[11px] top-4 bottom-0 w-px bg-app-border"></div>' : ''}
                        <div onclick="router.navigate('job-details', {id:'${j.id}'})" class="bg-app-card border border-app-border rounded-xl p-3 cursor-pointer active:scale-[0.99] transition-transform">
                            <div class="flex items-center justify-between gap-2 mb-1"><p class="text-xs text-blue-300 font-semibold">${j.jobNumber || asType(j)}</p><p class="text-[10px] text-app-muted">${j.status || 'Scheduled'}</p></div>
                            <p class="text-sm font-semibold text-white truncate">${j.title}</p>
                            <p class="text-xs text-app-muted mt-1">${Utils.getFriendlyDate(j.date)}${dur > 1 ? ` → ${Utils.getFriendlyDate(endIso)} · ${dur} days` : ''}</p>
                            <p class="text-[11px] mt-1 ${isJob ? payment.className : 'text-app-muted'}">${j.contact || j.address || 'No client/location'}${isJob ? ` · ${payment.text}` : ''}</p>
                        </div>
                    </div>`;
                }).join('');

                const cardsHtml = jobs.length === 0
                    ? `<div class="border-2 border-dashed border-app-lighter rounded-xl p-8 flex flex-col items-center text-center"><p class="text-app-muted mb-3">No projects found with current filters</p><button onclick="router.params.projectSearch=''; router.params.projectFilter='All'; router.params.projectMonth='all'; router.params.projectType='All'; router.params.projectPayFilter='All'; router.params.projectMatFilter='All'; router.params.projectShowAdvanced=false; router.renderProjects(document.getElementById('app-content'))" class="text-blue-400 text-sm font-semibold">Clear filters</button></div>`
                    : groupMode === 'timeline' ? `<div class="bg-app-card/40 border border-app-border rounded-xl p-3">${timelineHtml}</div>`
                    : groupKeys.map(gk => `
                        ${groupMode === 'month' ? `<div class="sticky top-0 z-10 bg-app-bg/95 backdrop-blur py-2 mt-1 mb-2 border-b border-app-border"><p class="text-xs uppercase tracking-wider font-bold text-blue-400">${gk === 'no-date' ? 'No Date' : monthLabel(gk)} · ${grouped[gk].length}</p></div>` : ''}
                        <div class="space-y-3 mb-4">
                            ${grouped[gk].map(j => {
                                const sc = statusColors[j.status] || 'bg-app-lighter text-app-muted border-app-border';
                                const isJob = isJobType(j);
                                const payment = paymentState(j);
                                return `<div onclick="router.navigate('job-details', {id:'${j.id}'})" class="bg-app-card border border-app-border rounded-xl p-4 active:scale-[0.99] transition-transform cursor-pointer">
                                    <div class="flex justify-between items-start gap-3 mb-2">
                                        <div class="min-w-0 flex-1">
                                            <div class="flex items-center gap-2 mb-1 flex-wrap">

        function checkConflict() {
            const d = document.getElementById('j-date')?.value;
            const t = document.getElementById('j-time')?.value;
            const w = document.getElementById('conflict');
            if (!w || !d || !t) return;
            const selectedType = document.querySelector('input[name="type"]:checked')?.value || 'Job';
            const durEl = document.querySelector('#job-fields:not(.hidden) input[name="durationDays"]') || document.querySelector('#holiday-fields:not(.hidden) input[name="holidayDurationDays"]') || document.querySelector('input[name="durationDays"]') || document.querySelector('input[name="holidayDurationDays"]');
            const duration = Math.max(1, parseInt(durEl?.value || '1') || 1);
            const start = new Date(d + 'T12:00:00');
            const end = new Date(start);
            end.setDate(start.getDate() + (duration - 1));
            const hasConflict = DB.jobs.some(j => {
                if (j.status === 'Cancelled') return false;
                const js = new Date((j.date || '') + 'T12:00:00');
                const je = new Date(js);
                const jDur = Math.max(1, parseInt(j.durationDays || 1) || 1);
                je.setDate(js.getDate() + (jDur - 1));
                const overlapsDayRange = js <= end && je >= start;
                if (!overlapsDayRange) return false;
                const blockedType = j.type === 'Holiday' || j.type === 'Personal' || selectedType === 'Holiday' || selectedType === 'Personal';
                return blockedType || (j.time === t);
            });
            hasConflict ? w.classList.remove('hidden') : w.classList.add('hidden');

        function resolveTemplate(templateId, jobId = '', contactId = '') {
            const templates = Array.isArray((DB.settings || {}).templates) ? DB.settings.templates : [];
            const tpl = templates.find(t => t.id === templateId) || templates[0] || { subject: '', body: '' };
            const job = jobId ? DB.getJobById(jobId) : null;

            const contactFromParam = contactId ? DB.getContactById(contactId) : null;
            const contact = contactFromParam || contactFromJob || (job?.contact ? DB.contacts.find(c => c.name === job.contact) : null) || null;
            const balanceRaw = Math.max(0, (parseFloat(job?.price) || 0) - (parseFloat(job?.deposit) || 0));
            const quoteRaw = parseFloat(job?.price);
            const depositRaw = parseFloat(job?.deposit);
            const quoteTotal = Number.isFinite(quoteRaw) && quoteRaw > 0 ? `£${quoteRaw.toFixed(2)}` : '____';
            const depositTotal = Number.isFinite(depositRaw) && depositRaw > 0 ? `£${depositRaw.toFixed(2)}` : '____';
            const bookingDate = job?.date ? Utils.getFriendlyDate(job.date) : '____';
            const bookingTime = job?.time || '____';
            const agreementType = job?.agreementType || 'Services Agreement';
            const signatureLink = job?.signatureLink || '[Insert Link]';
            const paymentLink = job?.paymentLink || '[Insert Link]';
            const tokens = {
                clientName: contact?.name || job?.contact || 'Customer',
                clientPhone: contact?.phone || '',
                clientEmail: contact?.email || '',
                name: contact?.name || job?.contact || 'Customer',
                fao: contact?.fao || '',
                jobTitle: job?.title || '',
                jobNumber: job?.jobNumber || '',
                jobReference: job?.jobReference || '',
                jobDate: job?.date ? Utils.getFriendlyDate(job.date) : '',
                jobTime: job?.time || '',
                bookingDate,
                bookingTime,
                address: job?.address || contact?.address || '',
                service: job?.service || '',
                balance: `£${balanceRaw.toFixed(2)}`,
                quoteTotal,
                depositTotal,
                paymentLink,
                agreementType,
                signatureLink,
                companyName: (DB.settings?.branding?.companyName || 'ELITE WRAPZ')
            };
            const apply = (txt) => String(txt || '')
                .replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (_, k) => (tokens[k] ?? ''))
                .replace(/\{\s*([a-zA-Z0-9_]+)\s*\}/g, (_, k) => (tokens[k] ?? ''));
            return { template: tpl, job, contact, subject: apply(tpl.subject), body: apply(tpl.body) };
        }

                <button onclick="window.close()" style="background:#e2e8f0;color:#334155;border:none;padding:10px 28px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Close</button>
            </div>
            </body></html>`);

            printWin.focus();

        }

        function handleKeypad(key) {
            if(key === 'del') router.tempPasscode = router.tempPasscode.slice(0,-1);
            else if(router.tempPasscode.length < 6) router.tempPasscode += key;
            const dots = document.getElementById('dots').children;
            for(let i=0; i<6; i++) {
                dots[i].classList.toggle('active', i < router.tempPasscode.length);
            }
            if(router.tempPasscode.length === 6) {
                if(router.tempPasscode === '990704') router.navigate('secure-notes');
                else { 
                    router.tempPasscode = ''; 
                    const d = document.getElementById('dots'); 
                    d.classList.add('animate-shake'); 
                    setTimeout(()=> { d.classList.remove('animate-shake'); for(let dot of dots) dot.classList.remove('active'); }, 500); 
                }
            }
        }
        function handleCSV(input) {
            const f=input.files[0]; if(!f)return;
            Papa.parse(f, { header:true, skipEmptyLines:true, complete: (res) => {
                const pick = (row, keys = []) => {
                    for (const k of keys) {
                        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') return String(row[k]).trim();
                    }
                    return '';
                };
                const map = res.data.map(r => {
                    const first = pick(r, ['First Name','FirstName','Given Name']);
                    const last = pick(r, ['Last Name','LastName','Surname','Family Name']);
                    const full = `${first} ${last}`.trim();
                    return {
                        name: pick(r, ['Name','Full Name','Contact Name']) || full,
                        company: pick(r, ['Company','Company Name','Organisation','Organization']),
                        fao: pick(r, ['FAO','Attn','Attention','Contact Person']),
                        phone: pick(r, ['Phone','Mobile','Telephone','Tel']),
                        email: pick(r, ['Email','E-mail']),
                        website: pick(r, ['Website','Web','URL','Site']),
                        address: pick(r, ['Address','Street','Address 1','Location']),
                        notes: pick(r, ['Notes','Note','Comments','Comment'])
                    };
                }).filter(c => c.name || c.email || c.phone);
                const imported = DB.importContacts(map);
                showToast(`Imported ${imported} contacts`);
                router.navigate('contacts');
            }});
        }
        function handleJSONRestore(input) {
            const f = input.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (evt) => {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (!data || (!Array.isArray(data.jobs) && !Array.isArray(data.contacts))) {
                        alert('Invalid backup file.');
                        return;
                    }
                    const ok = confirm('Restore this backup? This will replace current app data on this device.');
                    if (!ok) return;
                    DB.loadFromObject(data);
                    if (CloudSync.user) CloudSync.queuePush();
                    showToast('Backup restored');
                    router.navigate('today');
                } catch (e) {
                    alert('Could not read backup JSON file.');
                } finally {
                    input.value = '';
                }
            };
            r.readAsText(f);
        }

        function openSignOffModal(id) {
            const proceed = confirm('Client sign-off confirms they are happy with the final install and approve completion. Continue to signature?');
            if (!proceed) return;
            const existing = document.getElementById('signoff-modal');
            if (existing) existing.remove();
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            const sigHeight = isMobile ? 230 : 180;
            const modal = document.createElement('div');
            modal.id = 'signoff-modal';
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-sheet">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-signature mr-2 text-blue-400"></i>Client Sign-Off</h2>
                        <button onclick="closeSignOffModal()" class="w-8 h-8 rounded-full bg-app-lighter text-app-muted flex items-center justify-center hover:text-white"><i class="fa-solid fa-times"></i></button>
                    </div>
                    ${isMobile ? `<button onclick="requestLandscapeForSignature()" class="w-full mb-4 py-2.5 rounded-xl border border-blue-500/40 bg-blue-500/10 text-blue-300 text-sm font-semibold"><i class="fa-solid fa-mobile-screen-button mr-2"></i>Rotate Signature Mode (Landscape)</button><p class="text-[11px] text-app-muted mb-3">Tip: use landscape for a wider signing area.</p>` : ''}
                    <div class="mb-4">
                        <label class="text-xs text-app-muted block mb-1">Client Name</label>
                        <input id="sig-client-name" type="text" placeholder="Enter client name..." class="w-full bg-app-lighter border border-app-border rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <p class="text-xs text-app-muted mb-2 font-semibold uppercase tracking-wider">Signature</p>
                    <div class="sig-canvas-wrap mb-1" style="height:${sigHeight}px;">
                        <canvas id="sig-canvas"></canvas>
                        <div id="sig-placeholder"><p class="text-gray-400 text-sm">Sign here</p></div>
                    </div>
                    <button onclick="clearSigCanvas()" class="text-xs text-app-muted mb-5 flex items-center gap-1 hover:text-white transition-colors mt-2">
                        <i class="fa-solid fa-rotate-left"></i> Clear
                    </button>
                    <label class="mb-5 flex items-start gap-3 bg-app-lighter border border-app-border rounded-xl p-3">
                        <input id="sig-accept-final" type="checkbox" class="custom-checkbox mt-0.5">
                        <span class="text-xs text-app-muted leading-relaxed">I confirm I am happy with the final install and approve completion of the work.</span>
                    </label>
                    <div class="flex gap-3">
                        <button onclick="closeSignOffModal()" class="flex-1 py-3 rounded-xl border border-app-border text-app-muted font-semibold text-sm hover:text-white transition-colors">Cancel</button>
                        <button onclick="saveSignature('${id}')" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-500 transition-colors shadow-lg shadow-blue-600/30">Save &amp; Complete</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
            setTimeout(() => initSigCanvas(), 60);
        }

        async function requestLandscapeForSignature() {
            try {
                if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
                showToast('Landscape signature mode enabled');
            } catch (_) {
                showToast('Rotate phone sideways for more signing space');
            }
        }

        async function closeSignOffModal() {
            const modal = document.getElementById('signoff-modal');
            if (modal) modal.remove();
            try {
                if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
            } catch (_) {}
            try {
                if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
            } catch (_) {}
        }

        function initSigCanvas() {
            const canvas = document.getElementById('sig-canvas');
            if (!canvas) return;
            const wrapper = canvas.parentElement;
            canvas.width = wrapper.offsetWidth || 300;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            let drawing = false;
            canvas.dataset.signed = 'false';
            const getPos = (e) => {
                const r = canvas.getBoundingClientRect();
                const src = e.touches ? e.touches[0] : e;
                return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
            };
            const start = (e) => { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
            const draw = (e) => {
                e.preventDefault();
                if (!drawing) return;
                if (canvas.dataset.signed !== 'true') {
                    canvas.dataset.signed = 'true';
                    const ph = document.getElementById('sig-placeholder');
                    if (ph) ph.style.display = 'none';
                }
                const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
            };
            const stop = () => { drawing = false; };
            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseleave', stop);
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        function clearSigCanvas() {
            const canvas = document.getElementById('sig-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            canvas.dataset.signed = 'false';
            const ph = document.getElementById('sig-placeholder');
            if (ph) ph.style.display = '';
        }

        function saveSignature(id) {
            const name = (document.getElementById('sig-client-name').value || '').trim();
            if (!name) { alert('Please enter the client name.'); return; }
            const accepted = !!document.getElementById('sig-accept-final')?.checked;
            if (!accepted) { alert('Please confirm the final install approval checkbox.'); return; }
            const canvas = document.getElementById('sig-canvas');
            if (!canvas || canvas.dataset.signed !== 'true') { alert('Please capture the client signature before saving.'); return; }
            const signature = canvas.toDataURL('image/png');
            DB.saveSignOff(id, signature, name);
            closeSignOffModal();
            router.renderJobDetails(document.getElementById('app-content'), id);
        }

        function openPhotoLightbox(id, idx, section = 'before') {
            const job = DB.getJobById(id);
            const source = section === 'after' ? (job?.afterPhotos || []) : ((job?.beforePhotos && job.beforePhotos.length) ? job.beforePhotos : (job?.photos || []));
            if (!job || !source.length) return;
            const existing = document.getElementById('photo-lightbox');
            if (existing) existing.remove();
            const lb = document.createElement('div');
            lb.id = 'photo-lightbox';
            lb.className = 'lightbox-overlay';
            let current = idx;
            const render = () => {
                const total = source.length;
                lb.innerHTML = `
                    <div style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px;z-index:10;">
                        <span style="color:rgba(255,255,255,.6);font-size:14px;font-weight:500;">${section === 'after' ? 'After' : 'Before'} · ${current + 1} / ${total}</span>
                        <button onclick="document.getElementById('photo-lightbox').remove()" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);color:white;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-times"></i></button>
                    </div>
                    <img src="${source[current]}" style="max-width:92vw;max-height:75vh;object-fit:contain;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,.8);user-select:none;">
                    <div style="display:flex;gap:24px;margin-top:20px;">
                        <button id="lb-prev" style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:white;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;${current===0?'opacity:.3;pointer-events:none;':''}"><i class="fa-solid fa-chevron-left"></i></button>
                        <button id="lb-next" style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:white;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;${current>=total-1?'opacity:.3;pointer-events:none;':''}"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>`;
                const prev = lb.querySelector('#lb-prev');
                const next = lb.querySelector('#lb-next');
                if (prev) prev.addEventListener('click', (e) => { e.stopPropagation(); if (current > 0) { current--; render(); } });
                if (next) next.addEventListener('click', (e) => { e.stopPropagation(); if (current < source.length - 1) { current++; render(); } });
            };
            lb.addEventListener('click', (e) => { if (e.target === lb) lb.remove(); });
            document.body.appendChild(lb);
            render();
        }

        window.addEventListener('DOMContentLoaded', () => {
            DB.init();
            CloudSync.init();
            router.navigate('today');
        });
    </script>
