<html lang="en">
<head>
    <meta charset="UTF-8">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        app: {
                            bg: '#050505', card: '#111111', lighter: '#1b1b1b',  
                            primary: '#3b82f6', text: '#f8fafc', muted: '#94a3b8',    
                            border: '#2a2a2a', success: '#10b981', warning: '#f59e0b',
                        }
                    },
                    animation: { 
                        'fade-in': 'fadeIn 0.2s ease-out', 
                        'slide-up': 'slideUp 0.3s ease-out',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'grow-line': 'growLine 0.4s ease-out forwards'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        growLine: { '0%': { height: '0%' }, '100%': { height: '100%' } },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
        .fab-shadow { box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.5); }
        .nav-item.active { color: #3b82f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #app-content > div { max-width: 1120px; margin-left: auto; margin-right: auto; }
        
        .custom-checkbox {
            appearance: none; background-color: #1e293b; margin: 0; width: 1.25em; height: 1.25em; 
            border: 1px solid #3b82f6; border-radius: 0.25em; display: grid; place-content: center; cursor: pointer;
        }
        .custom-checkbox::before {
            content: ""; width: 0.65em; height: 0.65em; transform: scale(0);
            transition: 120ms transform ease-in-out; box-shadow: inset 1em 1em white;
            transform-origin: center; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked { background-color: #3b82f6; }
        .custom-checkbox:checked::before { transform: scale(1); }

        .custom-checkbox-green {
            appearance: none; background-color: #064e3b; margin: 0; width: 1.25em; height: 1.25em; 
            border: 1px solid #10b981; border-radius: 0.25em; display: grid; place-content: center; cursor: pointer;
        }
        .custom-checkbox-green::before {
            content: ""; width: 0.65em; height: 0.65em; transform: scale(0);
            transition: 120ms transform ease-in-out; box-shadow: inset 1em 1em white;
            transform-origin: center; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox-green:checked { background-color: #10b981; }
        .custom-checkbox-green:checked::before { transform: scale(1); }
        
        /* Glass Effect */
        .glass-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(18, 18, 18, 0.85) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Keypad Styling */
        .keypad-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background-color: #1e293b; color: white; font-size: 26px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.1s;
            user-select: none;
            border: 1px solid #334155;
        }
        .keypad-btn:active { background-color: #3b82f6; border-color: #3b82f6; transform: scale(0.95); }
        
        .dot {
            width: 14px; height: 14px; border-radius: 50%;
            background-color: #334155; transition: all 0.2s ease;
        }
        .dot.active {
            background-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
            transform: scale(1.1);
        }

        /* Nav active top-glow indicator */
        .nav-item.active { color: #3b82f6; position: relative; }
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: -4px; left: 50%;
            transform: translateX(-50%);
            width: 32px; height: 3px;
            background: #3b82f6;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 0 10px 2px rgba(59, 130, 246, 0.7);
        }

        /* Stat card gradients */
        .stat-card-revenue    { background: linear-gradient(135deg,rgba(16,185,129,.12) 0%,rgba(12,12,12,.95) 100%); border-color:rgba(16,185,129,.25)!important; }
        .stat-card-outstanding{ background: linear-gradient(135deg,rgba(245,158,11,.12) 0%,rgba(12,12,12,.95) 100%); border-color:rgba(245,158,11,.25)!important; }
        .stat-card-jobs       { background: linear-gradient(135deg,rgba(59,130,246,.12) 0%,rgba(12,12,12,.95) 100%); border-color:rgba(59,130,246,.25)!important; }
        .stat-card-completion { background: linear-gradient(135deg,rgba(168,85,247,.12) 0%,rgba(12,12,12,.95) 100%); border-color:rgba(168,85,247,.25)!important; }

        /* Revenue goal progress */
        .goal-bar { transition: width .7s cubic-bezier(.4,0,.2,1); }

        /* Modal overlay / bottom-sheet */
        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,.88);
            backdrop-filter:blur(8px); z-index:200;
            display:flex; align-items:flex-end; justify-content:center;
            animation:fadeIn .2s ease-out;
        }
        .modal-sheet {
            background:#111111; border:1px solid #2a2a2a;
            border-radius:24px 24px 0 0; width:100%; max-width:480px;
            padding:24px; animation:slideUp .3s ease-out;
            max-height:92vh; overflow-y:auto;
        }

        /* Signature canvas wrapper */
        .sig-canvas-wrap {
            border:2px dashed #334155; border-radius:12px;
            background:#fff; position:relative; overflow:hidden;
        }
        #sig-canvas { display:block; touch-action:none; cursor:crosshair; }
        #sig-placeholder {
            position:absolute; inset:0; display:flex;
            align-items:center; justify-content:center;
            pointer-events:none;
        }

        /* Photo lightbox */
        .lightbox-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,.96);
            z-index:300; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            animation:fadeIn .18s ease-out;
        }
    </style>
</head>

    <script>
        // --- DATA MANAGEMENT ---
        const DB = {
            jobs: [], contacts: [], user: { name: "Richard", email: "richarddyatess@gmail.com" },
            settings: { monthlyGoal: 5000 },
            updatedAt: null,
            secureNotes: "Gateway ID: 54 02 69 02 45 51\nEORI: GB045268219000",
            vaultEntries: [
                { id: 'vault-gateway', label: 'Gateway ID', value: '54 02 69 02 45 51', kind: 'Code' },
                { id: 'vault-eori', label: 'EORI Number', value: 'GB045268219000', kind: 'Code' }
            ],
            makeId(prefix = 'id') {
                return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
            },
            uniqueList(list = []) {
                return [...new Set((Array.isArray(list) ? list : []).filter(Boolean))];
            },
            normalizeAndDeduplicateData() {
                // Contacts
                const contactsByKey = new Map();
                (this.contacts || []).forEach(c => {
                    const id = c?.id || this.makeId('contact');
                    const name = (c?.name || '').trim();
                    const email = (c?.email || '').trim().toLowerCase();
                    const key = id || (email ? `email:${email}` : `name:${name.toLowerCase()}`);
                    if (!contactsByKey.has(key)) contactsByKey.set(key, { ...c, id, name });
                });
                this.contacts = Array.from(contactsByKey.values());

                // Jobs
                const jobsByKey = new Map();
                (this.jobs || []).forEach(j => {
                    const id = j?.id || this.makeId('job');
                    const n = { ...j, id };
                    n.checklist = Array.isArray(n.checklist) ? n.checklist : [];
                    n.photos = this.uniqueList(n.photos);
                    n.beforePhotos = this.uniqueList(Array.isArray(n.beforePhotos) ? n.beforePhotos : (Array.isArray(n.photos) ? n.photos : []));
                    n.afterPhotos = this.uniqueList(n.afterPhotos);
                    n.documents = Array.isArray(n.documents) ? n.documents : [];
                    n.durationDays = n.durationDays ? Math.max(1, parseInt(n.durationDays)) : 1;
                    n.paymentPlanEnabled = !!n.paymentPlanEnabled;
                    n.paymentPlanDetails = (n.paymentPlanDetails || '').toString();
                    n.depositPaidDate = n.depositPaidDate || '';
                    n.depositPaidMethod = n.depositPaidMethod || '';
                    n.fullPaymentPaidDate = n.fullPaymentPaidDate || '';
                    n.fullPaymentPaidMethod = n.fullPaymentPaidMethod || '';
                    n.accommodationNeeded = !!n.accommodationNeeded;
                    n.accomHotel = n.accomHotel || '';
                    n.accomAddress = n.accomAddress || '';
                    n.accomRef = n.accomRef || '';
                    n.accomCheckIn = n.accomCheckIn || '';
                    n.accomCheckOut = n.accomCheckOut || '';
                    n.accomNotes = n.accomNotes || '';
                    n.accomScreenshot = n.accomScreenshot || null;
                    const key = n.id || `${(n.jobNumber || '').toLowerCase()}|${n.date || ''}|${(n.title || '').toLowerCase()}`;
                    if (!jobsByKey.has(key)) jobsByKey.set(key, n);
                });
                this.jobs = Array.from(jobsByKey.values());

                // Vault
                const vaultByKey = new Map();
                (this.vaultEntries || []).forEach(v => {
                    const id = v?.id || this.makeId('vault');
                    const n = {
                        id,
                        label: (v?.label || 'Untitled').trim(),
                        value: (v?.value || '').toString(),
                        kind: (v?.kind || 'Code').trim()
                    };
                    const key = n.id || `${n.label.toLowerCase()}|${n.value}`;
                    if (!vaultByKey.has(key)) vaultByKey.set(key, n);
                });
                this.vaultEntries = Array.from(vaultByKey.values());
            },

            init() {
                const sJ = localStorage.getItem('app_jobs');
                const sC = localStorage.getItem('app_contacts');
                const sN = localStorage.getItem('app_secure_notes');
                const sS = localStorage.getItem('app_settings');
                const sV = localStorage.getItem('app_vault_entries');
                const sU = localStorage.getItem('app_updated_at');
                if (sJ) this.jobs = JSON.parse(sJ);
                if (sC) this.contacts = JSON.parse(sC);
                if (sN) this.secureNotes = sN;
                if (sS) this.settings = JSON.parse(sS);
                this.updatedAt = sU || new Date().toISOString();
                if (sV) {
                    try { this.vaultEntries = JSON.parse(sV); } catch (_) {}
                } else if (this.secureNotes) {
                    this.vaultEntries = this.secureNotes.split('\n').map((line, idx) => {
                        const parts = line.split(':');
                        const label = (parts.shift() || `Item ${idx + 1}`).trim();
                        const value = parts.join(':').trim();
                        return { id: this.makeId('vault'), label, value, kind: 'Code' };
                    }).filter(x => x.value);
                }
                this.migrateData();
            },
            save(options = {}) {
                this.normalizeAndDeduplicateData();
                if (!options.preserveTimestamp) this.updatedAt = new Date().toISOString();
                localStorage.setItem('app_jobs', JSON.stringify(this.jobs));
                localStorage.setItem('app_contacts', JSON.stringify(this.contacts));
                localStorage.setItem('app_secure_notes', this.secureNotes);
                localStorage.setItem('app_vault_entries', JSON.stringify(this.vaultEntries));
                localStorage.setItem('app_settings', JSON.stringify(this.settings));
                localStorage.setItem('app_updated_at', this.updatedAt || new Date().toISOString());
                if (!options.skipCloud) CloudSync.queuePush();
            },
            getSerializableData() {
                this.normalizeAndDeduplicateData();
                return {
                    jobs: this.jobs,
                    contacts: this.contacts,
                    secureNotes: this.secureNotes,
                    vaultEntries: this.vaultEntries,
                    settings: this.settings,
                    updatedAt: this.updatedAt || new Date().toISOString()
                };
            },
            loadFromObject(payload = {}) {
                this.jobs = Array.isArray(payload.jobs) ? payload.jobs : [];
                this.contacts = Array.isArray(payload.contacts) ? payload.contacts : [];
                this.secureNotes = payload.secureNotes || this.secureNotes;
                this.updatedAt = payload.updatedAt || this.updatedAt || new Date().toISOString();
                this.vaultEntries = Array.isArray(payload.vaultEntries) ? payload.vaultEntries : (this.secureNotes ? this.secureNotes.split('\n').map((line, idx) => {
                    const parts = line.split(':');
                    const label = (parts.shift() || `Item ${idx + 1}`).trim();
                    const value = parts.join(':').trim();
                    return { id: this.makeId('vault'), label, value, kind: 'Code' };
                }).filter(x => x.value) : this.vaultEntries);
                this.settings = { monthlyGoal: 5000, ...(payload.settings || this.settings || {}) };
                this.migrateData();
                this.save({ skipCloud: true, preserveTimestamp: true });
            },
            migrateData() {
                this.contacts = (this.contacts || []).map(c => ({ ...c, id: c.id || this.makeId('contact') }));
                this.jobs = (this.jobs || []).map(j => {
                    const n = { ...j };
                    if (n.contactId && !n.contact) {
                        const contact = this.contacts.find(c => c.id === n.contactId);
                        if (contact) n.contact = contact.name;
                    }
                    if (!n.contactId && n.contact) {
                        const contact = this.contacts.find(c => c.name === n.contact);
                        if (contact) n.contactId = contact.id;
                    }
                    if (!Array.isArray(n.beforePhotos)) n.beforePhotos = Array.isArray(n.photos) ? [...n.photos] : [];
                    if (!Array.isArray(n.afterPhotos)) n.afterPhotos = [];
                    return n;
                });
                this.vaultEntries = (this.vaultEntries || []).map((v, idx) => ({
                    id: v.id || this.makeId('vault'),
                    label: v.label || 'Untitled',
                    value: v.value || '',
                    kind: v.kind || 'Code'
                }));
                this.normalizeAndDeduplicateData();

            addContact(c) {

                this.contacts.push({ ...c, id: this.makeId('contact') });
                this.save();

            updateContact(c) {

                if (index !== -1) {
                    const oldName = this.contacts[index].name;
                    this.contacts[index] = c;
                    this.jobs = this.jobs.map(j => {

            addChecklist(id, txt) { const j = this.jobs.find(x => x.id === id); if (j) { if (!j.checklist) j.checklist = []; j.checklist.push({ text: txt, done: false }); this.save(); } },

            getJobsForDate(d) { 
                return this.jobs.filter(j => {
                    if (j.durationDays && parseInt(j.durationDays) > 1) {
                        const checkDate = new Date(d + 'T12:00:00');
                        const startDate = new Date(j.date + 'T12:00:00');
                        const endDate = new Date(startDate);
                        endDate.setDate(startDate.getDate() + (parseInt(j.durationDays) - 1));
                        return checkDate >= startDate && checkDate <= endDate;
                    }
                    return j.date === d;
                }); 
            },

            getUpcomingJobs() {
                const today = Utils.formatDate(new Date());
                return this.jobs
                    .filter(j => j.date >= today && j.status !== 'Cancelled' && j.status !== 'Completed')
                    .sort((a, b) => new Date(a.date + 'T' + (a.time||'00:00')) - new Date(b.date + 'T' + (b.time||'00:00')));
            },

                if (!contact) return [];
                return this.jobs.filter(j => (contact.id && j.contactId === contact.id) || (!j.contactId && j.contact === contact.name));

            getDashboardStats() {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const monthJobs = this.jobs.filter(j => {
                    const d = new Date(j.date + 'T12:00:00');
                    return d.getMonth() === currentMonth && d.getFullYear() === currentYear && j.status !== 'Cancelled' && (j.type === 'Job' || !j.type);
                });
                const totalRevenue = monthJobs.reduce((acc, j) => acc + (parseFloat(j.price)||0), 0);
                const completedCount = monthJobs.filter(j => j.status === 'Completed').length;
                const outstanding = this.jobs.reduce((acc, j) => {
                    if(j.status === 'Cancelled' || j.fullPaymentPaid || (j.type && j.type !== 'Job')) return acc;
                    const price = parseFloat(j.price) || 0;
                    const deposit = parseFloat(j.deposit) || 0;
                    return acc + (price - deposit);
                }, 0);
                return { monthRevenue: totalRevenue, monthCount: monthJobs.length, completedCount: completedCount, outstanding: outstanding };
            },
            getMaterialReminders(daysAhead = 5) {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const max = new Date(today);
                max.setDate(max.getDate() + daysAhead);
                return this.jobs
                    .filter(j => (!j.type || j.type === 'Job') && j.status !== 'Cancelled' && j.status !== 'Completed')
                    .filter(j => {
                        const d = new Date((j.date || '') + 'T12:00:00');
                        return d >= today && d <= max;
                    })
                    .filter(j => !j.materialsOrdered || !j.materialsDelivered)

                if (!this.auth) return;

                if (!this.user || !this.store || this.syncInProgress) return;

            },
            parseTimestamp(ts) {
                const ms = Date.parse(ts || '');
                return Number.isFinite(ms) ? ms : 0;
            },
            buildMergedPayload(localData = {}, remoteData = {}) {
                const localMs = this.parseTimestamp(localData.updatedAt);
                const remoteMs = this.parseTimestamp(remoteData.updatedAt);
                const preferLocal = localMs >= remoteMs;
                const primary = preferLocal ? localData : remoteData;
                const secondary = preferLocal ? remoteData : localData;
                return {
                    jobs: [...(primary.jobs || []), ...(secondary.jobs || [])],
                    contacts: [...(primary.contacts || []), ...(secondary.contacts || [])],
                    vaultEntries: [...(primary.vaultEntries || []), ...(secondary.vaultEntries || [])],
                    secureNotes: primary.secureNotes || secondary.secureNotes || '',
                    settings: { ...(secondary.settings || {}), ...(primary.settings || {}) },
                    updatedAt: new Date().toISOString()
                };
            },
            async autoSync(reason = 'auto') {
                const now = Date.now();
                if (!this.user || !this.store || this.syncInProgress) return;
                if (now - this.lastSyncAttemptAt < 15000) return;
                this.lastSyncAttemptAt = now;
                try {
                    await this.pullRemoteData({ silent: true, forceReconcile: true });
                } catch (err) {
                    console.warn(`Auto sync (${reason}) failed`, err);
                }
            },
            async pushRemoteData(options = {}) {
                if (!this.user || !this.store) return;
                this.syncInProgress = true;
                this.lastSyncStatus = 'Syncing';
                try {
                    await this.store.collection('trackerData').doc(this.user.uid).set(DB.getSerializableData(), { merge: true });
                    this.lastSyncedAt = new Date().toISOString();
                    this.lastSyncStatus = 'Synced';

                    this.syncInProgress = false;
                    if (router.currentRoute === 'more') router.renderMore(document.getElementById('app-content'));
                }
            },
            async pullRemoteData(options = {}) {
                if (!this.user || !this.store) return;
                this.syncInProgress = true;
                this.lastSyncStatus = 'Syncing';
                const ref = this.store.collection('trackerData').doc(this.user.uid);
                try {
                    const snap = await ref.get();
                    if (snap.exists) {
                        const remoteData = snap.data() || {};
                        if (options.forceReconcile) {
                            const merged = this.buildMergedPayload(DB.getSerializableData(), remoteData);
                            DB.loadFromObject(merged);
                            await ref.set(DB.getSerializableData(), { merge: false });
                        } else {
                            DB.loadFromObject(remoteData);
                        }
                        this.lastSyncedAt = new Date().toISOString();
                        this.lastSyncStatus = 'Synced';
                        if (!options.silent) showToast('Cloud data synced');
                    } else {
                        await ref.set(DB.getSerializableData(), { merge: true });
                        this.lastSyncedAt = new Date().toISOString();
                        this.lastSyncStatus = 'Initialized';
                        if (!options.silent) showToast('Cloud store initialized');
                    }
                } finally {
                    this.syncInProgress = false;
                    if (router.currentRoute === 'more') router.renderMore(document.getElementById('app-content'));

            }

            renderProjects(container) {
                const statusFilter = this.params.projectFilter || 'All';
                const sortBy = this.params.projectSort || 'newest';
                let jobs = [...DB.jobs];
                if (statusFilter !== 'All') jobs = jobs.filter(j => j.status === statusFilter);
                if (sortBy === 'newest') jobs.sort((a,b) => new Date(b.date+'T12:00:00') - new Date(a.date+'T12:00:00'));
                else if (sortBy === 'oldest') jobs.sort((a,b) => new Date(a.date+'T12:00:00') - new Date(b.date+'T12:00:00'));
                else if (sortBy === 'price') jobs.sort((a,b) => (parseFloat(b.price)||0) - (parseFloat(a.price)||0));

                const statusColors = {
                    'Scheduled': 'bg-blue-500/20 text-blue-400 border-blue-500/40',
                    'Completed': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40',
                    'Cancelled': 'bg-red-500/20 text-red-400 border-red-500/40'
                };
                const filters = ['All','Scheduled','Completed','Cancelled'];
                const sorts = [{v:'newest',l:'Newest'},{v:'oldest',l:'Oldest'},{v:'price',l:'By Price'}];

                container.innerHTML = `
                <div class="pt-12 px-5 pb-24 animate-fade-in">

                    </div>
                    <div class="flex gap-2 mb-3 overflow-x-auto pb-1 no-scrollbar">
                        ${filters.map(f=>`<button onclick="router.params.projectFilter='${f}'; router.renderProjects(document.getElementById('app-content'))" class="flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold border transition-all ${statusFilter===f?'bg-blue-600 border-blue-600 text-white':'bg-app-card border-app-border text-app-muted'}">${f}</button>`).join('')}
                    </div>
                    <div class="flex gap-2 mb-4">
                        ${sorts.map(s=>`<button onclick="router.params.projectSort='${s.v}'; router.renderProjects(document.getElementById('app-content'))" class="flex-1 py-2 rounded-lg text-xs font-semibold border transition-all ${sortBy===s.v?'bg-app-lighter border-blue-500/50 text-blue-400':'bg-app-card border-app-border text-app-muted'}">${s.l}</button>`).join('')}
                    </div>
                    <div class="space-y-3">
                        ${jobs.length === 0 ? `<div class="border-2 border-dashed border-app-lighter rounded-xl p-8 flex flex-col items-center text-center"><p class="text-app-muted mb-3">No projects found</p></div>` :
                        jobs.map(j => {
                            const sc = statusColors[j.status] || 'bg-app-lighter text-app-muted border-app-border';
                            const isJob = !j.type || j.type === 'Job';
                            return `<div onclick="router.navigate('job-details', {id:'${j.id}'})" class="bg-app-card border border-app-border rounded-xl p-4 active:scale-95 transition-transform cursor-pointer">

                                    <div class="flex-1 min-w-0 mr-3">

                                            ${j.jobNumber ? `<span class="text-xs font-mono font-bold text-blue-400">${j.jobNumber}</span>` : ''}
                                            <span class="text-xs text-app-muted">${j.type||'Job'}</span>
                                        </div>
                                        <h3 class="font-semibold text-white truncate">${j.title}</h3>
                                    </div>
                                    <span class="flex-shrink-0 px-2 py-0.5 rounded-full text-[10px] font-semibold border ${sc}">${j.status}</span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <p class="text-xs text-app-muted"><i class="fa-regular fa-calendar mr-1"></i>${Utils.getFriendlyDate(j.date)}</p>
                                    ${isJob && j.price ? `<p class="text-sm font-bold text-white">£${parseFloat(j.price).toFixed(2)}</p>` : ''}
                                </div>
                                ${j.contact ? `<p class="text-xs text-app-muted mt-1"><i class="fa-regular fa-user mr-1"></i>${j.contact}</p>` : ''}
                                ${j.address ? `<p class="text-xs text-app-muted truncate mt-1"><i class="fa-solid fa-location-dot mr-1"></i>${j.address}</p>` : ''}
                            </div>`;
                        }).join('')}

            },

        function checkConflict() {

            if (!w || !d || !t) return;
            const selectedType = document.querySelector('input[name="type"]:checked')?.value || 'Job';
            const durEl = document.querySelector('#job-fields:not(.hidden) input[name="durationDays"]') || document.querySelector('#holiday-fields:not(.hidden) input[name="holidayDurationDays"]') || document.querySelector('input[name="durationDays"]') || document.querySelector('input[name="holidayDurationDays"]');
            const duration = Math.max(1, parseInt(durEl?.value || '1') || 1);
            const start = new Date(d + 'T12:00:00');
            const end = new Date(start);
            end.setDate(start.getDate() + (duration - 1));
            const hasConflict = DB.jobs.some(j => {
                if (j.status === 'Cancelled') return false;
                const js = new Date((j.date || '') + 'T12:00:00');
                const je = new Date(js);
                const jDur = Math.max(1, parseInt(j.durationDays || 1) || 1);
                je.setDate(js.getDate() + (jDur - 1));
                const overlapsDayRange = js <= end && je >= start;
                if (!overlapsDayRange) return false;

            r.onload = (evt) => {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (!data || (!Array.isArray(data.jobs) && !Array.isArray(data.contacts))) {
                        alert('Invalid backup file.');
                        return;

        async function requestLandscapeForSignature() {
            try {
                if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
                showToast('Landscape signature mode enabled');
            } catch (_) {
                showToast('Rotate phone sideways for more signing space');
            }
        }

        async function closeSignOffModal() {
            const modal = document.getElementById('signoff-modal');
            if (modal) modal.remove();
            try {
                if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
            } catch (_) {}
            try {
                if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
            } catch (_) {}
        }

        function initSigCanvas() {
            const canvas = document.getElementById('sig-canvas');
            if (!canvas) return;
            const wrapper = canvas.parentElement;
            canvas.width = wrapper.offsetWidth || 300;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            let drawing = false;
            canvas.dataset.signed = 'false';
            const getPos = (e) => {
                const r = canvas.getBoundingClientRect();
                const src = e.touches ? e.touches[0] : e;
                return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
            };
            const start = (e) => { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
            const draw = (e) => {
                e.preventDefault();
                if (!drawing) return;
                if (canvas.dataset.signed !== 'true') {
                    canvas.dataset.signed = 'true';
                    const ph = document.getElementById('sig-placeholder');
                    if (ph) ph.style.display = 'none';
                }
                const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
            };
            const stop = () => { drawing = false; };
            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseleave', stop);
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        function clearSigCanvas() {
            const canvas = document.getElementById('sig-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            canvas.dataset.signed = 'false';
            const ph = document.getElementById('sig-placeholder');
            if (ph) ph.style.display = '';
        }

        function saveSignature(id) {
            const name = (document.getElementById('sig-client-name').value || '').trim();
            if (!name) { alert('Please enter the client name.'); return; }
            const accepted = !!document.getElementById('sig-accept-final')?.checked;
            if (!accepted) { alert('Please confirm the final install approval checkbox.'); return; }
            const canvas = document.getElementById('sig-canvas');
            if (!canvas || canvas.dataset.signed !== 'true') { alert('Please capture the client signature before saving.'); return; }
            const signature = canvas.toDataURL('image/png');
            DB.saveSignOff(id, signature, name);
            closeSignOffModal();
            router.renderJobDetails(document.getElementById('app-content'), id);
        }

        function openPhotoLightbox(id, idx, section = 'before') {
            const job = DB.getJobById(id);
            const source = section === 'after' ? (job?.afterPhotos || []) : ((job?.beforePhotos && job.beforePhotos.length) ? job.beforePhotos : (job?.photos || []));
            if (!job || !source.length) return;
            const existing = document.getElementById('photo-lightbox');
            if (existing) existing.remove();
            const lb = document.createElement('div');
            lb.id = 'photo-lightbox';
            lb.className = 'lightbox-overlay';
            let current = idx;
            const render = () => {
                const total = source.length;
                lb.innerHTML = `
                    <div style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px;z-index:10;">
                        <span style="color:rgba(255,255,255,.6);font-size:14px;font-weight:500;">${section === 'after' ? 'After' : 'Before'} · ${current + 1} / ${total}</span>
                        <button onclick="document.getElementById('photo-lightbox').remove()" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);color:white;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-times"></i></button>
                    </div>
                    <img src="${source[current]}" style="max-width:92vw;max-height:75vh;object-fit:contain;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,.8);user-select:none;">
                    <div style="display:flex;gap:24px;margin-top:20px;">
                        <button id="lb-prev" style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:white;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;${current===0?'opacity:.3;pointer-events:none;':''}"><i class="fa-solid fa-chevron-left"></i></button>
                        <button id="lb-next" style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:white;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;${current>=total-1?'opacity:.3;pointer-events:none;':''}"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>`;
                const prev = lb.querySelector('#lb-prev');
                const next = lb.querySelector('#lb-next');
                if (prev) prev.addEventListener('click', (e) => { e.stopPropagation(); if (current > 0) { current--; render(); } });
                if (next) next.addEventListener('click', (e) => { e.stopPropagation(); if (current < source.length - 1) { current++; render(); } });
            };
            lb.addEventListener('click', (e) => { if (e.target === lb) lb.remove(); });
            document.body.appendChild(lb);
            render();
        }

        window.addEventListener('DOMContentLoaded', () => {
            DB.init();
            CloudSync.init();
            router.navigate('today');
        });
    </script>
</body>
</html>
